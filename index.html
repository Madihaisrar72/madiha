<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Countries API & Explorer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold">🌍 Global Countries API</h1>
                <p class="text-indigo-200 mt-1">A lightweight endpoint containing 30 countries, capitals, flags, and brief histories.</p>
            </div>
            <div class="mt-4 md:mt-0">
                <a href="countries.json" target="_blank" class="bg-white text-indigo-600 font-semibold px-5 py-2.5 rounded-lg shadow hover:bg-indigo-50 transition">
                    View Raw API Output ↗
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">Available Countries (<span id="count">0</span>)</h2>
            <input type="text" id="search" placeholder="Search country or capital..." class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white w-full sm:w-72 shadow-sm">
        </div>

        <!-- Grid Container -->
        <div id="countries-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Loading state -->
            <p id="loading" class="col-span-full text-center text-gray-500 py-10">Loading countries data...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-500 text-sm border-t mt-12">
        <p>Hosted live on Domain &bull; Developed for University Task</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let allCountries = [];

        // Fetch data from endpoint
        fetch('countries.json?' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                allCountries = data;
                document.getElementById('count').textContent = data.length;
                displayCountries(data);
            })
            .catch(err => {
                console.error('Error loading API data:', err);
                document.getElementById('countries-grid').innerHTML = `<p class="col-span-full text-center text-red-500 py-10">Failed to load countries data. Please check console.</p>`;
            });

        function displayCountries(countries) {
            const grid = document.getElementById('countries-grid');
            grid.innerHTML = '';
            
            if(countries.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No countries found.</p>`;
                return;
            }

            countries.forEach(c => {
                const card = `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col">
                        <div class="h-36 bg-gray-100 overflow-hidden flex items-center justify-center p-4 border-b">
                            <img src="${c.picture}" alt="${c.name} flag" class="max-h-full max-w-full object-contain shadow-sm rounded">
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-lg text-gray-900">${c.name}</h3>
                                <p class="text-sm font-semibold text-indigo-600 mb-2">Capital: ${c.capital}</p>
                                <p class="text-xs text-gray-600 leading-relaxed">${c.history}</p>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Search functionality
        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allCountries.filter(c => 
                c.name.toLowerCase().includes(term) || c.capital.toLowerCase().includes(term)
            );
            document.getElementById('count').textContent = filtered.length;
            displayCountries(filtered);
        });
    </script>
</body>
</html>
